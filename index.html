
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CJ Online Shopping</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e84b20">
<link rel="icon" href="/icon.png" type="image/png">
<script src="https://accounts.google.com/gsi/client" async defer><\/script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#222}
header{background:#e84b20;color:white;padding:16px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand-logo{width:42px;height:42px;object-fit:contain;border-radius:8px;background:white}
h2{margin:0;font-size:22px}
button{border:0;border-radius:8px;padding:11px 14px;background:#e84b20;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#333}
input,select{padding:12px;border:1px solid #ddd;border-radius:8px;width:100%;margin:6px 0}
.search{margin-top:12px}
nav{display:flex;gap:8px;overflow:auto;padding:12px;background:white}
nav button{white-space:nowrap}
main{padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{background:white;border-radius:12px;padding:10px;box-shadow:0 2px 8px #0001}
.product img{width:100%;height:140px;object-fit:cover;border-radius:9px;background:#eee}
.product h3{font-size:15px;margin:8px 0}
.price{color:#e84b20;font-weight:bold;margin:8px 0}
.actions{display:flex;gap:6px}
.actions button{flex:1;padding:9px 5px;font-size:12px}
.panel{background:white;border-radius:12px;padding:15px;margin:12px 0}
.hidden{display:none}
#message{padding:10px;color:#16813c}
footer{text-align:center;padding:25px;color:#777}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="top">
      <div class="brand">
            <img class="brand-logo" src="/icon.png" alt="CJ Logo">
                  <h2>CJ Online Shopping</h2>
                      </div>
                          <div>
                                <button onclick="showCart()">🛒 Cart <span id="cartCount">0</span></button>
                                      <button class="secondary" onclick="showWishlist()">♡</button>
                                          </div>
                                            </div>
                                              <input class="search" id="search" placeholder="Search products..." oninput="renderProducts()">
                                                <div id="loginArea" style="margin-top:10px">
                                                    <div id="googleButton"></div>
                                                      </div>
                                                        <div id="userArea" class="hidden" style="margin-top:10px">
                                                            <span id="userName"></span>
                                                                <button class="secondary" onclick="logout()">Logout</button>
                                                                  </div>
                                                                  </header>
                                                                  <nav id="categories"></nav>
                                                                  <main>
                                                                    <div id="message"></div>
                                                                      <section id="home">
                                                                          <h3>Latest Products</h3>
                                                                              <div class="grid" id="products"></div>
                                                                                </section>
                                                                                  <section id="cartPage" class="hidden">
                                                                                      <h3>Shopping Cart</h3>
                                                                                          <div id="cartItems"></div>
                                                                                              <h3 id="cartTotal"></h3>
                                                                                                  <div class="panel">
                                                                                                        <h3>Checkout</h3>
                                                                                                              <input id="phone" placeholder="Phone number">
                                                                                                                    <button onclick="checkout()">Submit Order</button>
                                                                                                                        </div>
                                                                                                                          </section>
                                                                                                                            <section id="wishlistPage" class="hidden">
                                                                                                                                <h3>My Wishlist</h3>
                                                                                                                                    <div id="wishlistItems" class="grid"></div>
                                                                                                                                      </section>
                                                                                                                                        <section id="ordersPage" class="hidden">
                                                                                                                                            <h3>My Orders</h3>
                                                                                                                                                <div id="myOrders"></div>
                                                                                                                                                  </section>
                                                                                                                                                    <section class="panel">
                                                                                                                                                        <button class="secondary" onclick="showOrders()">My Orders</button>
                                                                                                                                                            <button class="secondary" onclick="showHome()">Home</button>
                                                                                                                                                              </section>
                                                                                                                                                              </main>
                                                                                                                                                              <footer>CJ Online Shopping</footer>
                                                                                                                                                              <script>
                                                                                                                                                              const API = "";
                                                                                                                                                              let products = [];
                                                                                                                                                              let cart = JSON.parse(localStorage.getItem("cj_cart") || "[]");
                                                                                                                                                              let wishlist = JSON.parse(localStorage.getItem("cj_wishlist") || "[]");
                                                                                                                                                              let idToken = localStorage.getItem("cj_token") || "";
                                                                                                                                                              let user = JSON.parse(localStorage.getItem("cj_user") || "null");
                                                                                                                                                              let category = "ሁሉም";
                                                                                                                                                              const categories = ["ሁሉም","ወንድ","ሴት","ልጆች","ጫማ","አክሰሰሪ"];

                                                                                                                                                              function msg(text){document.getElementById("message").textContent=text}
                                                                                                                                                              function saveCart(){
                                                                                                                                                                localStorage.setItem("cj_cart",JSON.stringify(cart));
                                                                                                                                                                  document.getElementById("cartCount").textContent=cart.reduce((n,x)=>n+x.qty,0);
                                                                                                                                                                  }
                                                                                                                                                                  function saveWishlist(){localStorage.setItem("cj_wishlist",JSON.stringify(wishlist))}
                                                                                                                                                                  async function request(url,options={}){
                                                                                                                                                                    options.headers=options.headers||{};
                                                                                                                                                                      if(idToken) options.headers.Authorization="Bearer "+idToken;
                                                                                                                                                                        const r=await fetch(API+url,options);
                                                                                                                                                                          const data=await r.json();
                                                                                                                                                                            if(!r.ok) throw new Error(data.error||"Request failed");
                                                                                                                                                                              return data;
                                                                                                                                                                              }
                                                                                                                                                                              function showHome(){showSection("home")}
                                                                                                                                                                              function showCart(){showSection("cartPage");renderCart()}
                                                                                                                                                                              function showWishlist(){showSection("wishlistPage");renderWishlist()}
                                                                                                                                                                              function showOrders(){showSection("ordersPage");loadOrders()}
                                                                                                                                                                              function showSection(id){
                                                                                                                                                                                ["home","cartPage","wishlistPage","ordersPage"].forEach(x=>document.getElementById(x).classList.add("hidden"));
                                                                                                                                                                                  document.getElementById(id).classList.remove("hidden");
                                                                                                                                                                                  }
                                                                                                                                                                                  function renderCategories(){
                                                                                                                                                                                    document.getElementById("categories").innerHTML=categories.map(c=>
                                                                                                                                                                                        '<button onclick="setCategory('+JSON.stringify(c)+')">'+c+'</button>'
                                                                                                                                                                                          ).join("");
                                                                                                                                                                                          }
                                                                                                                                                                                          function setCategory(c){category=c;renderProducts()}
                                                                                                                                                                                          function safe(s){
                                                                                                                                                                                            return String(s??"").replace(/[&<>"']/g,c=>({
                                                                                                                                                                                                "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
                                                                                                                                                                                                  })[c]);
                                                                                                                                                                                                  }
                                                                                                                                                                                                  function renderProducts(){
                                                                                                                                                                                                    const q=document.getElementById("search").value.toLowerCase();
                                                                                                                                                                                                      const list=products.filter(p=>(category==="ሁሉም"||p.category===category)&&p.name.toLowerCase().includes(q));
                                                                                                                                                                                                        document.getElementById("products").innerHTML=list.map(p=>
                                                                                                                                                                                                            '<article class="product">'+
                                                                                                                                                                                                                '<img src="'+safe(p.image)+'" alt="">'+
                                                                                                                                                                                                                    '<h3>'+safe(p.name)+'</h3>'+
                                                                                                                                                                                                                        '<div class="price">'+Number(p.price).toLocaleString()+' ETB</div>'+
                                                                                                                                                                                                                            '<small>Stock: '+p.stock+'</small>'+
                                                                                                                                                                                                                                '<div class="actions">'+
                                                                                                                                                                                                                                    '<button onclick="addCart('+p.id+')">Add</button>'+
                                                                                                                                                                                                                                        '<button class="secondary" onclick="addWish('+p.id+')">♡</button>'+
                                                                                                                                                                                                                                            '</div></article>'
                                                                                                                                                                                                                                              ).join("")||"No products found";
                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                              function addCart(id){
                                                                                                                                                                                                                                                const p=products.find(x=>x.id===id);if(!p)return;
                                                                                                                                                                                                                                                  const old=cart.find(x=>x.id===id);
                                                                                                                                                                                                                                                    if(old)old.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
                                                                                                                                                                                                                                                      saveCart();msg("Added to cart");
                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                      function addWish(id){
                                                                                                                                                                                                                                                        if(!wishlist.includes(id))wishlist.push(id);
                                                                                                                                                                                                                                                          saveWishlist();msg("Added to wishlist");
                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                          function renderCart(){
                                                                                                                                                                                                                                                            const box=document.getElementById("cartItems");
                                                                                                                                                                                                                                                              if(!cart.length){box.textContent="Your cart is empty";document.getElementById("cartTotal").textContent="";return}
                                                                                                                                                                                                                                                                box.innerHTML=cart.map(x=>
                                                                                                                                                                                                                                                                    '<div class="panel">'+safe(x.name)+' — '+x.price+' ETB × '+
                                                                                                                                                                                                                                                                        '<input type="number" min="1" value="'+x.qty+'" style="width:75px" onchange="changeQty('+x.id+',this.value)">'+
                                                                                                                                                                                                                                                                            '<button class="secondary" onclick="removeCart('+x.id+')">Remove</button></div>'
                                                                                                                                                                                                                                                                              ).join("");
                                                                                                                                                                                                                                                                                document.getElementById("cartTotal").textContent="Total: "+cart.reduce((s,x)=>s+x.price*x.qty,0)+" ETB";
                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                function changeQty(id,q){
                                                                                                                                                                                                                                                                                  const x=cart.find(a=>a.id===id);if(x)x.qty=Math.max(1,Number(q)||1);
                                                                                                                                                                                                                                                                                    saveCart();renderCart();
                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                    function removeCart(id){cart=cart.filter(x=>x.id!==id);saveCart();renderCart()}
                                                                                                                                                                                                                                                                                    function renderWishlist(){
                                                                                                                                                                                                                                                                                      const list=products.filter(p=>wishlist.includes(p.id));
                                                                                                                                                                                                                                                                                        document.getElementById("wishlistItems").innerHTML=list.map(p=>
                                                                                                                                                                                                                                                                                            '<div class="product"><img src="'+safe(p.image)+'"><h3>'+safe(p.name)+'</h3>'+
                                                                                                                                                                                                                                                                                                '<div class="price">'+p.price+' ETB</div>'+
                                                                                                                                                                                                                                                                                                    '<button onclick="addCart('+p.id+')">Add to Cart</button>'+
                                                                                                                                                                                                                                                                                                        '<button class="secondary" onclick="removeWish('+p.id+')">Remove</button></div>'
                                                                                                                                                                                                                                                                                                          ).join("")||"Wishlist is empty";
                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                          function removeWish(id){wishlist=wishlist.filter(x=>x!==id);saveWishlist();renderWishlist()}
                                                                                                                                                                                                                                                                                                          async function checkout(){
                                                                                                                                                                                                                                                                                                            if(!idToken){msg("Please login with Google first");return}
                                                                                                                                                                                                                                                                                                              if(!cart.length){msg("Your cart is empty");return}
                                                                                                                                                                                                                                                                                                                const phone=document.getElementById("phone").value.trim();
                                                                                                                                                                                                                                                                                                                  if(!phone){msg("Enter your phone number");return}
                                                                                                                                                                                                                                                                                                                    try{
                                                                                                                                                                                                                                                                                                                        const result=await request("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,items:cart.map(x=>({product_id:x.id,quantity:x.qty}))})});
                                                                                                                                                                                                                                                                                                                            cart=[];saveCart();renderCart();msg("Order submitted successfully. Order #"+result.order_id);
                                                                                                                                                                                                                                                                                                                              }catch(e){msg(e.message)}
                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                              async function loadOrders(){
                                                                                                                                                                                                                                                                                                                                try{
                                                                                                                                                                                                                                                                                                                                    const d=await request("/api/orders");
                                                                                                                                                                                                                                                                                                                                        document.getElementById("myOrders").innerHTML=d.orders.map(o=>
                                                                                                                                                                                                                                                                                                                                              '<div class="panel">Order #'+o.id+' — '+o.total+' ETB — '+safe(o.status)+'</div>'
                                                                                                                                                                                                                                                                                                                                                  ).join("")||"No orders yet";
                                                                                                                                                                                                                                                                                                                                                    }catch(e){msg(e.message)}
                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                    function handleGoogle(response){
                                                                                                                                                                                                                                                                                                                                                      idToken=response.credential;
                                                                                                                                                                                                                                                                                                                                                        localStorage.setItem("cj_token",idToken);
                                                                                                                                                                                                                                                                                                                                                          request("/api/me").then(d=>{
                                                                                                                                                                                                                                                                                                                                                              user=d.user;localStorage.setItem("cj_user",JSON.stringify(user));
                                                                                                                                                                                                                                                                                                                                                                  updateLogin();msg("Google login successful");
                                                                                                                                                                                                                                                                                                                                                                    }).catch(e=>msg(e.message));
                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                    function updateLogin(){
                                                                                                                                                                                                                                                                                                                                                                      if(user){
                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("loginArea").classList.add("hidden");
                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("userArea").classList.remove("hidden");
                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("userName").textContent="Hello, "+user.name;
                                                                                                                                                                                                                                                                                                                                                                                    }else{
                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("loginArea").classList.remove("hidden");
                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("userArea").classList.add("hidden");
                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                              function logout(){
                                                                                                                                                                                                                                                                                                                                                                                                idToken="";user=null;
                                                                                                                                                                                                                                                                                                                                                                                                  localStorage.removeItem("cj_token");localStorage.removeItem("cj_user");
                                                                                                                                                                                                                                                                                                                                                                                                    updateLogin();msg("Logged out");
                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                    async function initGoogle(){
                                                                                                                                                                                                                                                                                                                                                                                                      try{
                                                                                                                                                                                                                                                                                                                                                                                                          const d=await request("/api/config");
                                                                                                                                                                                                                                                                                                                                                                                                              if(!d.google_client_id){msg("Google Login is not configured");return}
                                                                                                                                                                                                                                                                                                                                                                                                                  if(!window.google){setTimeout(initGoogle,500);return}
                                                                                                                                                                                                                                                                                                                                                                                                                      google.accounts.id.initialize({client_id:d.google_client_id,callback:handleGoogle});
                                                                                                                                                                                                                                                                                                                                                                                                                          google.accounts.id.renderButton(document.getElementById("googleButton"),{theme:"outline",size:"large"});
                                                                                                                                                                                                                                                                                                                                                                                                                            }catch(e){msg(e.message)}
                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                            async function loadProducts(){
                                                                                                                                                                                                                                                                                                                                                                                                                              try{
                                                                                                                                                                                                                                                                                                                                                                                                                                  const d=await request("/api/products");products=d.products;
                                                                                                                                                                                                                                                                                                                                                                                                                                      renderCategories();renderProducts();saveCart();
                                                                                                                                                                                                                                                                                                                                                                                                                                        }catch(e){msg(e.message)}
                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                        updateLogin();loadProducts();initGoogle();

                                                                                                                                                                                                                                                                                                                                                                                                                                        if("serviceWorker" in navigator){
                                                                                                                                                                                                                                                                                                                                                                                                                                          window.addEventListener("load",()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                              navigator.serviceWorker.register("/service-worker.js").catch(console.error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                <\/script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>`;
